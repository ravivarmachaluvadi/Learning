  drawDino(gx, mount, R.t, {
    rider:true,
    run:R.runPhase,
    air:!R.onGround && !R.flying,
    mood: R.slow>0 ? 'dizzy' : (R.over||R.power>0 ? 'joy' : null),
    flap: R.flying ? R.t*16 : R.t*9
  });
  gx.restore();
  gx.globalAlpha = 1;
  /* butterfly carrying us */
  if(R.flying){
    gx.save(); gx.translate(sx+4, R.py-118);
    const fl = Math.sin(R.t*18);
    gx.fillStyle='#FF8FB1';
    gx.beginPath(); gx.ellipse(-16,-6,16,26*Math.abs(fl)+6,0.5,0,TAU); gx.fill();
    gx.fillStyle='#B39DDB';
    gx.beginPath(); gx.ellipse(16,-6,16,26*Math.abs(fl)+6,-0.5,0,TAU); gx.fill();
    gx.fillStyle='#53344D';
    gx.beginPath(); gx.ellipse(0,0,7,16,0,0,TAU); gx.fill();
    gx.strokeStyle='#53344D'; gx.lineWidth=2; gx.lineCap='round';
    gx.beginPath(); gx.moveTo(-3,-14); gx.quadraticCurveTo(-8,-24,-12,-26); gx.stroke();
    gx.beginPath(); gx.moveTo(3,-14); gx.quadraticCurveTo(8,-24,12,-26); gx.stroke();
    gx.strokeStyle='rgba(83,52,77,.5)'; gx.lineWidth=3;
    gx.beginPath(); gx.moveTo(-6,14); gx.lineTo(-14,40); gx.moveTo(6,14); gx.lineTo(14,40); gx.stroke();
    gx.restore();
  }
}
function drawParticles(){
  for(const p of R.parts){
    const a = 1 - p.age/p.life;
    const sx = p.x - (p.kind==='confetti'||p.kind==='trail' ? R.camX : R.camX);
    gx.globalAlpha = a;
    if(p.kind==='spark') drawStarShape(gx, sx, p.y, 8*a+3, p.spin, '#FFD23F');
    else if(p.kind==='gem') drawGemShape(gx, sx, p.y, 8*a+3, '#8EC5FF');
    else if(p.kind==='dust'){ gx.fillStyle='rgba(255,246,229,.8)'; gx.beginPath(); gx.arc(sx,p.y,7*a+2,0,TAU); gx.fill(); }
    else if(p.kind==='heart'){ gx.font='700 '+(18*a+8)+'px sans-serif'; gx.textAlign='center'; gx.fillText('💗', sx, p.y); }
    else if(p.kind==='dizzy') drawStarShape(gx, sx, p.y, 6, p.spin, '#FFF6E5');
    else if(p.kind==='trail'){ gx.fillStyle='hsl('+(p.hue)+',90%,70%)'; gx.beginPath(); gx.arc(sx,p.y,9*a+2,0,TAU); gx.fill(); }
    else { gx.fillStyle='hsl('+(p.hue)+',85%,65%)'; gx.save(); gx.translate(sx,p.y); gx.rotate(p.spin); gx.fillRect(-5,-3,10,6); gx.restore(); }
  }
  gx.globalAlpha = 1;
}
function drawWeather(th){
  for(const wp of R.weather){
    if(th.particle==='leaf'){
      gx.fillStyle='rgba(95,196,111,.7)';
      gx.save(); gx.translate(wp.x,wp.y); gx.rotate(Math.sin(wp.spin)*0.8);
      gx.beginPath(); gx.ellipse(0,0,7,3.4,0,0,TAU); gx.fill(); gx.restore();
    } else if(th.particle==='snow'){
      gx.fillStyle='rgba(255,255,255,.9)';
      gx.beginPath(); gx.arc(wp.x,wp.y,3.4,0,TAU); gx.fill();
    } else if(th.particle==='sand'){
      gx.fillStyle='rgba(240,192,112,.6)';
      gx.beginPath(); gx.arc(wp.x,wp.y,2.6,0,TAU); gx.fill();
    } else if(th.particle==='ember'){
      gx.fillStyle='rgba(255,170,92,.75)';
      gx.beginPath(); gx.arc(wp.x, VHEIGHT-wp.y, 3,0,TAU); gx.fill();
    } else {
      drawStarShape(gx, wp.x, wp.y, 4+Math.sin(wp.spin)*2, wp.spin, 'rgba(255,255,255,.8)');
    }
  }
}
function drawFloaties(){
  gx.textAlign='center';
  for(const f of R.floaties){
    const a = 1 - f.age/1.2;
    gx.globalAlpha = a;
    gx.font='800 30px "Baloo 2", sans-serif';
    gx.strokeStyle='rgba(83,52,77,.6)'; gx.lineWidth=5; gx.lineJoin='round';
    const y = f.y - f.age*60;
    gx.strokeText(f.txt, f.x-R.camX, y);
    gx.fillStyle=f.color;
    gx.fillText(f.txt, f.x-R.camX, y);
  }
  gx.globalAlpha = 1;
}

/* ---------------- main loop ---------------- */
function gameLoop(ts){
  if(!R.active) return;
  R.raf = requestAnimationFrame(gameLoop);
  let dt = (ts - R.last)/1000;
  R.last = ts;
  if(!(dt>0)) dt = 0.016;
  dt = Math.min(dt, 0.04);
  if(R.paused) return;
  step(dt);
  render();
}
</script>
<script>
'use strict';
/* ================================================================
   MINI-GAMES, REWARDS, PROGRESSION & WIRING
   ================================================================ */

/* ---------------- stage completion & rewards ---------------- */
function finishStage(w,l,res){
  const key = stageKey(w,l);
  const prev = save.done[key]||0;
  const wasWorldDone = worldDone(w);
  save.done[key] = Math.max(prev, res.rating||3);
  save.stars += res.stars;
  save.gems += res.gems;
  save.eggs += res.eggs;
  const unlocks = [];
  if(res.eggs>0 && unlockDino('trixie')) unlocks.push('trixie');
  let worldJustDone = false;
  if(!wasWorldDone && worldDone(w)){
    worldJustDone = true;
    award('w'+w);
    if(unlockDino(WORLD_DINO[w])) unlocks.push(WORLD_DINO[w]);
  }
  award('first');
  checkStatBadges();
  persist();
  showReward(w,l,res,unlocks,worldJustDone);
}

function showReward(w,l,res,unlocks,worldJustDone){
  const allDone = WORLDS.every((_,i)=>worldDone(i));
  const card = $('#rewardCard');
  const word = (worldJustDone && allDone) ? 'YOU DID IT ALL! 👑'
             : worldJustDone ? 'WORLD COMPLETE! '+WORLDS[w].icon
             : pick(Math.random, ['AMAZING!','SUPER!','WOW!','GREAT JOB!','FANTASTIC!','YIPPEE!']);
  card.innerHTML = '';
  const wd = document.createElement('div');
  wd.className='reward-word'; wd.textContent = word;
  card.appendChild(wd);
  const starsRow = document.createElement('div');
  starsRow.className='reward-stars';
  for(let i=0;i<3;i++){
    const s=document.createElement('span'); s.textContent='⭐'; starsRow.appendChild(s);
  }
  card.appendChild(starsRow);
  const lines = document.createElement('div');
  lines.className='reward-lines';
  const addLine = html=>{
    const d=document.createElement('div'); d.className='reward-line'; d.innerHTML=html;
    lines.appendChild(d); return d;
  };
  addLine('⭐ +'+res.stars+' stars');
  if(res.gems>0) addLine('💎 +'+res.gems+' gems');
  if(res.eggs>0) addLine('🥚➜🐣 '+(res.eggs===1?'Baby dino saved!':res.eggs+' baby dinos saved!'));
  card.appendChild(lines);
  unlocks.forEach(id=>{
    const d = dinoById(id);
    const u = document.createElement('div');
    u.className='unlock-card';
    u.innerHTML = '<div class="unlock-title">✨ NEW FRIEND! ✨</div>';
    const cv = document.createElement('canvas'); cv.width=150; cv.height=120;
    u.appendChild(cv);
    const nm = document.createElement('div');
    nm.className='unlock-name'; nm.textContent = d.name+' the '+d.species;
    u.appendChild(nm);
    card.appendChild(u);
    paintDinoCanvas(cv, d, {mood:'joy'});
  });
  const btns = document.createElement('div');
  btns.className='reward-btns';
  const bReplay = document.createElement('button');
  bReplay.className='btn round'; bReplay.textContent='🔄'; bReplay.title='Play again';
  bReplay.addEventListener('click', ()=>{ SFX.play('click'); launchStage(w,l); });
  const bMap = document.createElement('button');
  bMap.className='btn round'; bMap.textContent='🗺️'; bMap.title='World map';
  bMap.addEventListener('click', ()=>{ SFX.play('click'); gotoMap(); });
  const bNext = document.createElement('button');
  bNext.className='btn primary'; bNext.innerHTML='NEXT&nbsp;▶';
  bNext.addEventListener('click', ()=>{
    SFX.play('click');
    if(l < STAGE_COUNT-1) launchStage(w, l+1);
    else gotoMap();
  });
  btns.appendChild(bReplay); btns.appendChild(bMap); btns.appendChild(bNext);
  card.appendChild(btns);
  show('scr-reward');
  confettiBurst(worldJustDone?40:24);
  /* animate: stars pop, lines slide in */
  const rating = res.rating||3;
  const starEls = starsRow.children;
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      if(i<rating){ starEls[i].classList.add('lit'); SFX.play('star'); }
      else starEls[i].classList.add('dim');
    }, 500+i*380);
  }
  Array.from(lines.children).forEach((el,i)=>{
    setTimeout(()=>{ el.classList.add('in'); SFX.play('pop'); }, 1500+i*320);
  });
  Array.from(card.querySelectorAll('.unlock-card')).forEach((el,i)=>{
    setTimeout(()=>{ el.classList.add('in'); SFX.play('rescue'); confettiBurst(16); }, 2200+i*600);
  });
  refreshTotals();
}

/* ---------------- mini-game scaffolding ---------------- */
const MG = { w:0, round:0, locked:false };
function startMini(w){
  hideModals(); stopRunner();
  MG.w = w; MG.round = 0; MG.locked = false;
  const th = WORLDS[w];
  $('#scr-mini').style.background = th.card;
  const wrap = $('#miniWrap');
  wrap.innerHTML =
    '<div class="mini-head">'+
      '<button class="btn round small" id="miniQuit">◀️</button>'+
      '<div class="mini-title" id="miniTitle"></div>'+
      '<button class="btn round small muteBtn">'+(save.muted?'🔇':'🔊')+'</button>'+
    '</div>'+
    '<div class="mini-goal" id="miniGoal"></div>'+
    '<div class="mini-dots" id="miniDots"></div>'+
    '<div class="mini-msg" id="miniMsg"></div>'+
    '<div class="mini-stage" id="miniStage"></div>';
  $('#miniQuit').addEventListener('click', ()=>{ SFX.play('click'); gotoMap(); });
  wireMuteButtons();
  show('scr-mini');
  ({starcatch:miniStarCatch, eggrescue:miniEggRescue, dinomatch:miniDinoMatch,
    colors:miniColors, treasure:miniTreasure})[th.mini]();
}
function miniDots(n, icon){
  const d = $('#miniDots');
  d.innerHTML = '';
  for(let i=0;i<n;i++){ const s=document.createElement('span'); s.textContent=icon; d.appendChild(s); }
}
function litDot(i){
  const s = $('#miniDots').children[i];
  if(s) s.classList.add('lit');
}
function miniWin(res){
  bigWord('YOU DID IT! 🎉','#7CE26B');
  SFX.play('fanfare');
  setTimeout(()=>finishStage(MG.w, MINI_STAGE, res), 1400);
}

/* ---------------- ⭐ Star Catch (Jungle) ---------------- */
function miniStarCatch(){
  $('#miniTitle').textContent = '🌟 Star Catch';
  $('#miniGoal').textContent = '👆 Tap the stars!';
  const GOAL = 12;
  miniDots(GOAL,'⭐');
  const stage = $('#miniStage');
  let count = 0, alive = 0, over = false;
  function spawn(){
    if(over || alive>=2) return;
    alive++;
    const b = document.createElement('button');
    b.className = 'mini-item mini-star';
    b.textContent = '⭐';
    const place = ()=>{
      b.style.left = (5+Math.random()*75)+'%';
      b.style.top = (5+Math.random()*70)+'%';
    };
    place();
    const mover = setInterval(()=>{ b.classList.add('wig'); place(); }, 2400);
    b.addEventListener('pointerdown', e=>{
      e.preventDefault();
      if(over || b.dataset.hit) return;
      b.dataset.hit = '1';
      clearInterval(mover);
      alive--;
      b.classList.remove('wig');
      b.classList.add('pop-out');
      SFX.play('star');
      litDot(count); count++;
      setTimeout(()=>b.remove(), 380);
      if(count>=GOAL){
        over = true;
        miniWin({stars:GOAL+2, gems:4, eggs:0, rating:3});
      } else setTimeout(spawn, 240);
    });
    stage.appendChild(b);
  }
  spawn();
  setTimeout(spawn, 500);
}

/* ---------------- 🥚 Egg Rescue (Desert) ---------------- */
function miniEggRescue(){
  $('#miniTitle').textContent = '🥚 Egg Rescue';
  $('#miniGoal').textContent = '👆 Tap the wiggly eggs!';
  const rounds = [1,2,2];
  let round = 0, saved = 0;
  const totalBabies = rounds.reduce((a,b)=>a+b,0);
  miniDots(totalBabies,'🐣');
  const stage = $('#miniStage');
  function buildRound(){
    stage.innerHTML = '';
    $('#miniMsg').textContent = round===0 ? '' : 'More friends! 🎉';
    const rowDiv = document.createElement('div');
    rowDiv.className = 'egg-row';
    rowDiv.style.marginTop = '10vh';
    const n = 5, wigglers = new Set();
    while(wigglers.size < rounds[round]) wigglers.add(Math.floor(Math.random()*n));
    let left = rounds[round];
    for(let i=0;i<n;i++){
      const b = document.createElement('button');
      b.className = 'egg-btn' + (wigglers.has(i)?' wiggler':'');
      b.textContent = '🥚';
      if(wigglers.has(i)) b.innerHTML = '🥚<span class="spark">✨</span>';
      b.addEventListener('pointerdown', e=>{
        e.preventDefault();
        if(b.dataset.done) return;
        if(wigglers.has(i)){
          b.dataset.done='1';
          b.classList.remove('wiggler');
          b.innerHTML = '🐣';
          b.classList.add('pop-out');
          SFX.play('hatch');
          setTimeout(()=>{ b.classList.remove('pop-out'); b.textContent='🐣'; b.style.opacity='1'; b.style.transform='none'; }, 380);
          litDot(saved); saved++;
          left--;
          if(left===0){
            round++;
            if(round>=rounds.length){
              setTimeout(()=>miniWin({stars:8, gems:3, eggs:totalBabies, rating:3}), 700);
            } else setTimeout(buildRound, 1000);
          }
        } else {
          b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope');
          SFX.play('boop');
        }
      });
      rowDiv.appendChild(b);
    }
    stage.appendChild(rowDiv);
  }
  buildRound();
}

/* ---------------- 🧩 Dino Match (Frozen Valley) ---------------- */
function miniDinoMatch(){
  $('#miniTitle').textContent = '🧩 Dino Match';
  $('#miniGoal').textContent = '👆 Find the two twins!';
  const ROUNDS = 3;
  let round = 0;
  miniDots(ROUNDS,'💙');
  const stage = $('#miniStage');
  function buildRound(){
    stage.innerHTML = '';
    const shuffled = DINOS.slice().sort(()=>Math.random()-0.5);
    const twin = shuffled[0], dA = shuffled[1], dB = shuffled[2];
    const deck = [twin,twin,dA,dB].map((d,i)=>({d,i})).sort(()=>Math.random()-0.5);
    const grid = document.createElement('div');
    grid.className = 'match-grid';
    grid.style.marginTop = '6vh';
    let picked = null, locked = false;
    deck.forEach(item=>{
      const cardB = document.createElement('button');
      cardB.className = 'match-card';
      const cv = document.createElement('canvas'); cv.width=150; cv.height=110;
      cardB.appendChild(cv);
      paintDinoCanvas(cv, item.d, {});
      cardB.addEventListener('pointerdown', e=>{
        e.preventDefault();
        if(locked) return;
        if(picked === cardB){
          cardB.classList.remove('picked'); picked = null; SFX.play('boop'); return;
        }
        if(!picked){
          picked = cardB; picked.dataset.dino = item.d.id;
          cardB.classList.add('picked');
          SFX.play('click');
          return;
        }
        if(picked.dataset.dino === item.d.id && item.d.id === twin.id){
          locked = true;
          cardB.classList.add('won'); picked.classList.add('won');
          SFX.play('yay');
          litDot(round); round++;
          if(round>=ROUNDS) setTimeout(()=>miniWin({stars:9, gems:3, eggs:0, rating:3}), 800);
          else setTimeout(buildRound, 1000);
        } else {
          cardB.classList.add('picked');
          const p = picked;
          locked = true;
          setTimeout(()=>{
            cardB.classList.remove('picked'); p.classList.remove('picked');
            cardB.classList.add('nope'); p.classList.add('nope');
            SFX.play('boop');
            setTimeout(()=>{ cardB.classList.remove('nope'); p.classList.remove('nope'); locked=false; }, 450);
          }, 250);
          picked = null;
        }
      });
      grid.appendChild(cardB);
    });
    stage.appendChild(grid);
  }
  buildRound();
}

/* ---------------- 🎨 Color Challenge (Volcano) ---------------- */
function miniColors(){
  $('#miniTitle').textContent = '🎨 Color Time';
  $('#miniGoal').textContent = '👆 Tap the same color!';
  const ROUNDS = 5;
  const COLORS = [
    ['#FF6B6B','red'],['#5E97E8','blue'],['#FFD23F','yellow'],
    ['#3FB55F','green'],['#8A5CF6','purple'],['#FF8FB1','pink']
  ];
  let round = 0;
  miniDots(ROUNDS,'🎈');
  const stage = $('#miniStage');
  function buildRound(){
    stage.innerHTML = '';
    const opts = COLORS.slice().sort(()=>Math.random()-0.5).slice(0,4);
    const target = opts[Math.floor(Math.random()*4)];
    const holder = document.createElement('div');
    holder.className = 'color-asker';
    holder.style.marginTop = '2vh';
    const bubble = document.createElement('div');
    bubble.className = 'speech';
    bubble.innerHTML = 'Find this! ➜ <span class="color-blob" style="background:'+target[0]+'"></span>';
    holder.appendChild(bubble);
    const cv = document.createElement('canvas'); cv.width=190; cv.height=140;
    holder.appendChild(cv);
    paintDinoCanvas(cv, dinoById(save.mount), {mood:'joy'});
    const pads = document.createElement('div');
    pads.className = 'color-pads';
    opts.forEach(c=>{
      const p = document.createElement('button');
      p.className = 'color-pad';
      p.style.background = 'linear-gradient(180deg,'+c[0]+',' + c[0]+'cc)';
      p.setAttribute('aria-label', c[1]);
      p.addEventListener('pointerdown', e=>{
        e.preventDefault();
        if(p.dataset.done) return;
        if(c === target){
          p.dataset.done = '1';
          p.classList.add('yay');
          SFX.play('yay');
          litDot(round); round++;
          if(round>=ROUNDS) setTimeout(()=>miniWin({stars:10, gems:3, eggs:0, rating:3}), 700);
          else setTimeout(buildRound, 800);
        } else {
          p.classList.remove('nope'); void p.offsetWidth; p.classList.add('nope');
          SFX.play('boop');
        }
      });
      pads.appendChild(p);
    });
    holder.appendChild(pads);
    stage.appendChild(holder);
  }
  buildRound();
}

/* ---------------- 🗺️ Treasure Hunt (Rainbow World) ---------------- */
function miniTreasure(){
  $('#miniTitle').textContent = '🗺️ Treasure Hunt';
  $('#miniGoal').textContent = '👆 Follow the paw prints!';
  const ROUNDS = 2, SIZE = 4;
  let round = 0;
  miniDots(ROUNDS,'💎');
  const stage = $('#miniStage');
  function buildRound(){
    stage.innerHTML = '';
    /* random monotone path from bottom-left to top-right */
    const path = [];
    let cx0 = 0, cy0 = SIZE-1;
    path.push([cx0,cy0]);
    while(cx0<SIZE-1 || cy0>0){
      if(cx0>=SIZE-1) cy0--;
      else if(cy0<=0) cx0++;
      else if(Math.random()<0.5) cx0++; else cy0--;
      path.push([cx0,cy0]);
    }
    let stepI = 0;
    const grid = document.createElement('div');
    grid.className = 'hunt-grid';
    grid.style.gridTemplateColumns = 'repeat('+SIZE+',auto)';
    grid.style.marginTop = '4vh';
    const tiles = [];
    for(let y=0;y<SIZE;y++){
      for(let x=0;x<SIZE;x++){
        const t = document.createElement('button');
        t.className = 'hunt-tile';
        t.dataset.x = x; t.dataset.y = y;
        grid.appendChild(t);
        tiles.push(t);
      }
    }
    const tileAt = (x,y)=>tiles[y*SIZE+x];
    const isChestStep = i => i === path.length-1;
    function setTarget(){
      const [x,y] = path[stepI];
      const t = tileAt(x,y);
      t.classList.add('target');
      t.textContent = isChestStep(stepI) ? '🎁' : '🐾';
      if(isChestStep(stepI)) t.classList.add('chest-tile');
    }
    grid.addEventListener('pointerdown', e=>{
      const t = e.target.closest('.hunt-tile');
      if(!t) return;
      e.preventDefault();
      const [x,y] = path[stepI];
      if(+t.dataset.x===x && +t.dataset.y===y){
        t.classList.remove('target');
        if(isChestStep(stepI)){
          t.classList.add('pop-out');
          SFX.play('treasure');
          bigWord('TREASURE! 💎','#8EC5FF');
          litDot(round); round++;
          if(round>=ROUNDS) setTimeout(()=>miniWin({stars:8, gems:6, eggs:0, rating:3}), 900);
          else setTimeout(buildRound, 1100);
        } else {
          t.classList.add('stamped');
          t.textContent = '🐾';
          SFX.play('pop');
          stepI++;
          setTarget();
        }
      } else {
        t.classList.remove('nope'); void t.offsetWidth; t.classList.add('nope');
        SFX.play('boop');
      }
    });
    stage.appendChild(grid);
    setTarget();
  }
  buildRound();
}

/* ---------------- global wiring ---------------- */
function wireMuteButtons(){
  $$('.muteBtn').forEach(b=>{
    b.textContent = save.muted ? '🔇' : '🔊';
    if(b.dataset.wired) return;
    b.dataset.wired = '1';
    b.addEventListener('click', ()=>{
      save.muted = !save.muted;
      persist();
      SFX.setMuted(save.muted);
      $$('.muteBtn').forEach(x=>x.textContent = save.muted?'🔇':'🔊');
      if(!save.muted) SFX.play('click');
    });
  });
}

$('#btnPlay').addEventListener('click', ()=>{
  SFX.play('click');
  if(Object.keys(save.done).length===0) startLevel(0,0);
  else gotoMap();
});
$$('.go-collection').forEach(b=>b.addEventListener('click', ()=>{ SFX.play('click'); gotoCollection(currentScreen); }));
$$('.go-badges').forEach(b=>b.addEventListener('click', ()=>{ SFX.play('click'); gotoBadges(currentScreen); }));
$$('.go-title').forEach(b=>b.addEventListener('click', ()=>{ SFX.play('click'); show('scr-title'); }));
$$('.go-settings').forEach(b=>b.addEventListener('click', ()=>{ SFX.play('click'); $('#modal-settings').classList.add('on'); }));
$('#btnSettingsClose').addEventListener('click', ()=>{ SFX.play('click'); hideModals(); });
$('#btnCollBack').addEventListener('click', ()=>{
  SFX.play('click');
  if(returnScreen==='scr-map') gotoMap(); else show('scr-title');
});
$('#btnBadgeBack').addEventListener('click', ()=>{
  SFX.play('click');
  if(returnScreen==='scr-map') gotoMap(); else show('scr-title');
});
let resetArmed = false;
$('#btnReset').addEventListener('click', ()=>{
  if(!resetArmed){
    resetArmed = true;
    $('#btnReset').textContent = '⚠️ Really? Tap again!';
    setTimeout(()=>{ resetArmed=false; $('#btnReset').textContent='🗑️ Reset all progress'; }, 2600);
    return;
  }
  save = defaultSave();
  persist();
  wireMuteButtons();
  hideModals();
  show('scr-title');
  toast('🌱 Fresh new adventure!');
});

/* wake audio on the very first touch anywhere */
document.addEventListener('pointerdown', ()=>SFX.unlock(), {passive:true});
/* no accidental page zoom / scroll during play */
$('#scr-hud').style.touchAction = 'none';
document.addEventListener('dblclick', e=>e.preventDefault());
/* auto-pause when the tab is hidden */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && R.active && !R.over && !R.paused) togglePause();
});

wireMuteButtons();
startTitleAnim();
</script>
